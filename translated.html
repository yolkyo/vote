<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>即時翻譯字幕</title>
  <style>
    body { background: black; color: white; font-size: 2em; text-align: center; }
    #subtitle { position: fixed; bottom: 20px; width: 100%; }
  </style>
</head>
<body>
  <div id="subtitle">等待翻譯中...</div>

  <script>
    const subtitle = document.getElementById("subtitle");
    const ws = new WebSocket("ws://localhost:8765");

    ws.onmessage = (event) => {
      subtitle.textContent = event.data;
    };
  </script>
</body>
</html>
